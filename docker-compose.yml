services:
  signal-aws-collector:
    profiles: [aws]
    build:
      context: .
      dockerfile: Dockerfile.aws
    environment:
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_PROFILE: "${AWS_PROFILE:-}"
      SIGNAL_AWS_ROLE_ARN: "${SIGNAL_AWS_ROLE_ARN:-}"
      SIGNAL_AWS_EXTERNAL_ID: "${SIGNAL_AWS_EXTERNAL_ID:-}"
      SIGNAL_AWS_POLL_INTERVAL_SECONDS: "${SIGNAL_AWS_POLL_INTERVAL_SECONDS:-60}"
      SIGNAL_AWS_LOOKBACK_SECONDS: "${SIGNAL_AWS_LOOKBACK_SECONDS:-300}"
      SIGNAL_AWS_STATE_PATH: "/var/lib/signal/aws-state.json"
      SIGNAL_AWS_CONFIG_PATH: "/etc/signal/aws-services.yaml"
      SIGNAL_INTAKE_URL: "${SIGNAL_INTAKE_URL:-http://signal-intake:8080/v1/intake}"
      SIGNAL_TENANT_ID: "${SIGNAL_TENANT_ID:-tenant-dev}"
      SIGNAL_INGEST_TOKEN: "${SIGNAL_INGEST_TOKEN:-local-only-token}"
    volumes:
      - signal-aws-state:/var/lib/signal
      - ./config/aws-services.yaml:/etc/signal/aws-services.yaml:ro
    restart: unless-stopped

  signal-intake:
    build:
      context: .
      dockerfile: Dockerfile.intake
    ports:
      - "8080:8080"
    environment:
      SIGNAL_INTAKE_LISTEN_ADDRESS: ":8080"
      SIGNAL_INTAKE_TENANT_ID: "${SIGNAL_TENANT_ID:-tenant-dev}"
      SIGNAL_INTAKE_TOKEN: "${SIGNAL_INGEST_TOKEN:-local-only-token}"
      SIGNAL_INTAKE_STORAGE_PATH: "/app/data/telemetry.jsonl"
    volumes:
      - signal-intake-data:/app/data
    restart: unless-stopped

  signal-agent:
    build: .
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      SIGNAL_AGENT_LISTEN_ADDRESS: ":4318"
      SIGNAL_AGENT_GRPC_LISTEN_ADDRESS: ":4317"
      SIGNAL_INTAKE_URL: "${SIGNAL_INTAKE_URL:-http://signal-intake:8080/v1/intake}"
      SIGNAL_TENANT_ID: "${SIGNAL_TENANT_ID:-tenant-dev}"
      SIGNAL_INGEST_TOKEN: "${SIGNAL_INGEST_TOKEN:-local-only-token}"
    restart: unless-stopped

volumes:
  signal-intake-data:
  signal-aws-state:
